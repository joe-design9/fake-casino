name: Build Goldkrone

on:
  push:
    paths:
      - "spielhalle/**"
      - ".github/workflows/build-goldkrone.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: IPA, RTP tests, screenshots, prerelease
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project spielhalle/Goldkrone.xcodeproj \
            -scheme Goldkrone \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Goldkrone.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build -name "*.app" -maxdepth 6
            exit 1
          fi
          rm -rf Payload Goldkrone.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Goldkrone.ipa Payload
          ls -lh Goldkrone.ipa
          rm -rf Payload

      - name: Choose an iPhone simulator
        id: sim
        run: |
          python3 - << 'PY'
          import json, os, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)

          def version_key(runtime):
              tail = runtime.split("iOS-")[-1]
              parts = []
              for piece in tail.replace("_", ".").split("."):
                  parts.append(int(piece) if piece.isdigit() else 0)
              return tuple(parts)

          found = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  if "iPhone" not in name:
                      continue
                  score = 0
                  if "Pro" in name and "Max" not in name:
                      score += 5
                  elif "Pro Max" in name:
                      score += 3
                  if any(token in name for token in ("17", "16", "15")):
                      score += 2
                  found.append((version_key(runtime), score, name, device["udid"]))
          if not found:
              raise SystemExit("No available iPhone simulator")
          found.sort(reverse=True)
          _, _, name, udid = found[0]
          print(f"Using {name} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={udid}\n")
              handle.write(f"name={name}\n")
          PY

      - name: Boot simulator
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --cellularMode active \
            --cellularBars 4 \
            --wifiBars 3 || true

      - name: Run RTP simulation tests
        run: |
          xcodebuild test \
            -project spielhalle/Goldkrone.xcodeproj \
            -scheme Goldkrone \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$PWD/build" \
            -only-testing:GoldkroneTests \
            -only-testing:GoldkroneUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Capture simulator screenshots
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/Build/Products/Release-iphonesimulator/Goldkrone.app"
          if [ ! -d "$APP" ]; then
            echo "Simulator app missing at $APP"
            find build/Build/Products -name "*.app" -maxdepth 2
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl terminate "$UDID" dev.joe.goldkrone || true
          mkdir -p screenshots
          capture() {
            local name="$1"
            local mode="$2"
            local wait="$3"
            xcrun simctl terminate "$UDID" dev.joe.goldkrone || true
            sleep 1
            xcrun simctl launch "$UDID" dev.joe.goldkrone -screenshot "$mode"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "screenshots/${name}.png"
            local bytes
            bytes=$(stat -f%z "screenshots/${name}.png")
            echo "$name $bytes bytes"
            if [ "$bytes" -lt 20000 ]; then
              echo "Screenshot $name looks empty"
              exit 1
            fi
          }
          capture "01-lobby" "lobby" 6
          capture "02-fruchtfeuer-gewinn" "fruit-win" 4
          capture "03-buch-freispiele" "book-freespins" 4
          capture "04-joker-sterne" "joker" 4
          capture "05-risikoleiter" "risikoleiter" 4
          capture "06-kartenrisiko" "kartenrisiko" 4
          capture "07-mega-gewinn" "megawin" 4
          ditto -c -k --keepParent screenshots Goldkrone-screenshots.zip
          ls -lh Goldkrone-screenshots.zip screenshots
          # One real spin, recorded, so the reel motion can be checked without a device.
          xcrun simctl io "$UDID" recordVideo --codec h264 --force "$PWD/Goldkrone-spin.mp4" &
          rec_pid=$!
          xcrun simctl terminate "$UDID" dev.joe.goldkrone || true
          sleep 1
          xcrun simctl launch "$UDID" dev.joe.goldkrone -screenshot spin
          sleep 6
          kill -INT "$rec_pid" || true
          wait "$rec_pid" || true
          ls -lh Goldkrone-spin.mp4 || true

      - name: Show simulator logs on failure
        if: failure() && steps.sim.outputs.udid != ''
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 4m --style compact \
            --predicate 'eventMessage CONTAINS "Goldkrone" OR processImagePath CONTAINS "Goldkrone"' || true
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 20 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goldkrone-ipa
          path: Goldkrone.ipa
          if-no-files-found: error

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: Goldkrone-screenshots
          path: screenshots
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goldkrone-v1.2.0
          target_commitish: ${{ github.sha }}
          name: GOLDKRONE Spielhalle v1.2.0
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          body: |
            Unsignierte Spielgeld-IPA von GOLDKRONE Spielhalle und Simulator-Screenshots.

            Nur Spielgeld. Keine Echtgeld-Einsätze, keine Auszahlungen, keine Käufe. Kronentaler haben keinen realen Wert.

            Installation mit Sideloadly oder AltStore steht in der README.
          files: |
            Goldkrone.ipa
            Goldkrone-screenshots.zip
            Goldkrone-spin.mp4
